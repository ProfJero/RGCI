# Restoration Grace Chapel International API — crafted by ProfJero
name = "rgci-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "rgci-management"
# Comma-separated list of origins allowed to call the API (your app URLs)
ALLOWED_ORIGINS = "https://rgci-app.rgcinternational001.workers.dev,https://rgci-app.pages.dev,https://myrgci.pages.dev,http://localhost:5173"
PROFJERO_BASE_URL = "https://profjero-sms-api-prod.amoakob947.workers.dev"
PROFJERO_SENDER_ID = "RGCI"
VAPID_SUBJECT = "mailto:rgcinternational001@gmail.com"
CLOUDINARY_CLOUD_NAME = ""
# "true" only for local development against the Firebase emulators
EMULATOR = "false"

# Daily jobs (UTC — the same as Ghana time) at 07:00: birthday & anniversary SMS, low SMS balance alert
[triggers]
crons = ["0 7 * * *"]

# Secrets — set with `npx wrangler secret put NAME`:
#   PROFJERO_API_KEY          ProfJero Connect secret key (pk_live_…)
#   VAPID_PUBLIC_KEY          from `npm run vapid`
#   VAPID_PRIVATE_KEY         from `npm run vapid`
#   CLOUDINARY_API_KEY        Cloudinary API key
#   CLOUDINARY_API_SECRET     Cloudinary API secret
#   FIREBASE_SERVICE_ACCOUNT  (optional) service-account JSON for birthday SMS & password resets
